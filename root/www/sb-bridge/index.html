<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sing-box Bridge Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); min-height: 100vh; }
    </style>
</head>
<body class="text-gray-800 font-sans antialiased p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <header class="glass rounded-3xl p-6 shadow-xl border border-white/40 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">Sing-box Bridge</h1>
                <p class="text-sm text-gray-500 mt-1">獨立 Web 服務管理面板 (Port: 2025)</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-6 bg-gray-50/80 p-3 rounded-2xl border border-gray-100">
                <div class="flex items-center gap-2">
                    <span id="status_dot" class="w-3 h-3 rounded-full bg-gray-400 animate-pulse"></span>
                    <span id="status_text" class="font-semibold text-sm">讀取中...</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="net_dot" class="w-3 h-3 rounded-full bg-gray-400"></span>
                    <span id="net_text" class="font-semibold text-sm">連通性測試中...</span>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="doAction('restart')" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full text-sm font-medium shadow-lg shadow-emerald-600/20 transition-all">重啟服務</button>
                <button onclick="doAction('stop')" class="px-5 py-2.5 bg-gray-500 hover:bg-gray-600 text-white rounded-full text-sm font-medium shadow-lg shadow-gray-500/10 transition-all">停止服務</button>
                <button onclick="openCreateModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-full text-sm font-medium shadow-lg shadow-blue-600/20 transition-all">＋ 新建配置</button>
            </div>
        </header>

        <main class="glass rounded-3xl shadow-xl border border-white/40 overflow-hidden">
            <div class="p-6 border-b border-gray-200/60 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-700">可用配置文件</h2>
                <span id="conf_dir_lbl" class="text-xs font-mono text-gray-400 bg-gray-100 px-2.5 py-1 rounded-md">/etc/sing-box</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50/50 text-gray-400 text-xs font-bold uppercase tracking-wider border-b border-gray-100">
                            <th class="py-4 px-6 text-center w-12">狀態</th>
                            <th class="py-4 px-6">檔案名稱</th>
                            <th class="py-4 px-6 w-32">協議</th>
                            <th class="py-4 px-6">域名 / IP</th>
                            <th class="py-4 px-6 text-right pr-10 w-[340px]">管理操作</th>
                        </tr>
                    </thead>
                    <tbody id="file_table_body" class="divide-y divide-gray-100 text-sm">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="editor_modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-4xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <div class="flex items-center gap-4 flex-1">
                    <h3 id="modal_title" class="text-lg font-bold text-gray-800">編輯配置文件</h3>
                    <input id="name_input" type="text" placeholder="文件名 (如: HK-01.json)" class="w-64 px-3 py-1 border border-gray-200 rounded-lg text-sm font-bold text-emerald-600 focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto flex-1">
                <div class="flex gap-2">
                    <input id="link_input" type="text" placeholder="⚡ 點擊此處粘貼節點鏈接 (Vmess/Vless/Trojan/SS/Hy2) ，將自動生成並覆蓋當前配置..." class="flex-1 px-4 py-3 border-2 border-dashed border-emerald-500 bg-emerald-50/30 rounded-xl text-sm focus:outline-none focus:border-emerald-600 placeholder-emerald-700/60" oninput="handleLinkImport(this)">
                </div>
                <div class="border border-gray-200 rounded-2xl overflow-hidden flex h-96 font-mono text-xs">
                    <div id="line_numbers" class="w-12 bg-gray-50 text-right pr-2 py-3 text-gray-400 select-none border-r border-r-gray-200 overflow-hidden leading-5">1</div>
                    <textarea id="json_textarea" class="flex-1 p-3 focus:outline-none resize-none overflow-x-auto whitespace-pre leading-5" oninput="updateLineNumbers()" onscroll="syncScroll()"></textarea>
                </div>
            </div>
            <div class="p-6 border-t border-gray-100 bg-gray-50 flex gap-3">
                <button onclick="checkSyntax()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl text-sm font-medium">檢查語法</button>
                <button onclick="formatJson()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl text-sm font-medium">格式化 JSON</button>
                <div class="flex-1"></div>
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-700 rounded-xl text-sm font-medium">取消</button>
                <button onclick="saveConfigFile()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium shadow-lg shadow-emerald-600/20">儲存配置</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/cgi-bin/sb-bridge/api.cgi';
        let isNewConfig = false;
        let localFilesCache = []; 
        let currentEditingFileId = ''; 

        async function fetchAPI(action, params = {}, options = {}) {
            const url = new URL(API_BASE, window.location.origin);
            url.searchParams.append('action', action);
            Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
            const res = await fetch(url, options);
            return res.json();
        }

        function safeB64Decode(str) {
            if (!str) return "";
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            try { return decodeURIComponent(escape(window.atob(str))); } catch (e) { return window.atob(str); }
        }

        function parseNodeLink(link) {
            if (!link || link.trim() === "") return null;
            link = link.trim();
            try {
                var protocolMatch = link.match(/^([a-zA-Z0-9]+):\/\/(.*)$/);
                if (!protocolMatch) throw new Error("無法識別的協議格式");
                var protocol = protocolMatch[1].toLowerCase();
                var rawContent = protocolMatch[2];
                var node = null;

                if (protocol === 'vmess') {
                    var vmessJson = JSON.parse(safeB64Decode(rawContent));
                    node = {
                        type: "vmess",
                        tag: vmessJson.ps || "VMess-Imported",
                        server: vmessJson.add,
                        server_port: parseInt(vmessJson.port),
                        uuid: vmessJson.id,
                        alter_id: parseInt(vmessJson.aid) || 0,
                        security: vmessJson.scy || "auto"
                    };
                    if (vmessJson.net === 'ws') {
                        node.transport = { type: "ws", path: vmessJson.path || "/", headers: { Host: vmessJson.host || vmessJson.add } };
                    }
                    if (vmessJson.tls === 'tls') {
                        node.tls = { enabled: true, server_name: vmessJson.sni || vmessJson.host || vmessJson.add };
                    }
                    return node;
                }

                var name = "Imported-Node";
                var parts = rawContent.split('#');
                if (parts.length > 1) { name = decodeURIComponent(parts.pop()); rawContent = parts.join('#'); }
                var query = {}; var mainUrl = rawContent;
                if (rawContent.indexOf('?') !== -1) {
                    var qParts = rawContent.split('?'); mainUrl = qParts[0];
                    qParts[1].split('&').forEach(function(item) {
                        var kv = item.split('='); if (kv.length === 2) query[kv[0]] = decodeURIComponent(kv[1]);
                    });
                }

                if (['vless', 'trojan', 'hysteria2'].indexOf(protocol) !== -1) {
                    var authAddr = mainUrl.split('@'); var uuidOrPwd = authAddr[0]; var addrPart = authAddr[1].split(':');
                    var host = addrPart[0]; var port = parseInt(addrPart[1]);
                    node = { type: protocol, tag: name, server: host, server_port: port };
                    if (protocol === 'trojan' || protocol === 'hysteria2') node.password = uuidOrPwd; else node.uuid = uuidOrPwd;
                    if (protocol === 'vless') { node.packet_encoding = "xudp"; if (query.flow) node.flow = query.flow; }
                    if (query.security === 'tls' || query.security === 'reality' || protocol === 'hysteria2' || protocol === 'trojan') {
                        node.tls = { enabled: true, server_name: query.sni || query.peer || host, insecure: (query.allowInsecure === '1' || query.insecure === '1') };
                        if (query.alpn) node.tls.alpn = query.alpn.split(',');
                        if (query.fp) { node.tls.utls = { enabled: true, fingerprint: query.fp }; }
                        else if (query.security === 'reality') { node.tls.utls = { enabled: true, fingerprint: "chrome" }; }
                        if (query.security === 'reality') { node.tls.reality = { enabled: true, public_key: query.pbk, short_id: query.sid || "" }; }
                    }
                    return node;
                }

                if (protocol === 'ss') {
                    var ssHostPort, ssMethodPwd;
                    if (mainUrl.indexOf('@') !== -1) {
                        var ssParts = mainUrl.split('@'); ssMethodPwd = safeB64Decode(ssParts[0]).split(':'); ssHostPort = ssParts[1].split(':');
                    } else {
                        var decodedMain = safeB64Decode(mainUrl); var ssParts2 = decodedMain.split('@'); ssMethodPwd = ssParts2[0].split(':'); ssHostPort = ssParts2[1].split(':');
                    }
                    node = { type: "shadowsocks", tag: name, server: ssHostPort[0], server_port: parseInt(ssHostPort[1]), method: ssMethodPwd[0], password: ssMethodPwd[1] };
                    return node;
                }
                throw new Error("暫不支持該協議: " + protocol);
            } catch (e) { alert("解析錯誤: " + e.message); return null; }
        }

        async function handleLinkImport(inputEl) {
            var val = inputEl.value.trim();
            if (!val || !/^[a-zA-Z0-9]+:\/\//.test(val)) return;
            var node = parseNodeLink(val);
            if (node) {
                var nameInput = document.getElementById('name_input');
                if (isNewConfig && !nameInput.value.trim()) {
                    var safeName = (node.tag || 'Imported-Node').replace(/[^a-zA-Z0-9_\-\u4e00-\u9fa5]/g, '_');
                    nameInput.value = safeName + '.json';
                }
                var standardConfig = {
                    "log": { "level": "info", "timestamp": true },
                    "inbounds": [ { "type": "socks", "tag": "socks-in", "listen": "0.0.0.0", "listen_port": 10811, "udp_fragment": true } ],
                    "outbounds": [ node ],
                    "route": { "rules": [ { "inbound": "socks-in", "action": "route", "outbound": node.tag } ], "final": node.tag }
                };
                var ta = document.getElementById('json_textarea');
                ta.value = JSON.stringify(standardConfig, null, 4);
                var origBg = inputEl.style.background; inputEl.style.background = '#d4edda';
                setTimeout(() => { inputEl.style.background = origBg; }, 300);
                inputEl.value = ''; updateLineNumbers();
            }
        }

        async function checkNetwork() {
            const netDot = document.getElementById('net_dot'); const netText = document.getElementById('net_text');
            try {
                const data = await fetchAPI('test_net');
                if (data.state === 'all_ok') { netDot.className = "w-3 h-3 rounded-full bg-emerald-500"; netText.textContent = "海內外暢通"; netText.className = "font-bold text-sm text-emerald-600"; }
                else if (data.state === 'cn_only') { netDot.className = "w-3 h-3 rounded-full bg-amber-500"; netText.textContent = "僅國內連通"; netText.className = "font-bold text-sm text-amber-500"; }
                else if (data.state === 'global_only') { netDot.className = "w-3 h-3 rounded-full bg-purple-500"; netText.textContent = "僅國外連通"; netText.className = "font-bold text-sm text-purple-500"; }
                else { netDot.className = "w-3 h-3 rounded-full bg-rose-500"; netText.textContent = "網路已斷開"; netText.className = "font-bold text-sm text-rose-500"; }
            } catch { netDot.className = "w-3 h-3 rounded-full bg-gray-400"; netText.textContent = "狀態未知"; }
        }

        async function renderList() {
            let statusData = {};
            try { statusData = await fetchAPI('status'); } catch(e) { console.error(e); }
            
            const sDot = document.getElementById('status_dot'); const sText = document.getElementById('status_text');
            if(statusData && statusData.running) {
                sDot.className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                sText.textContent = "運行中"; sText.className = "font-bold text-sm text-emerald-600";
            } else {
                sDot.className = "w-3 h-3 rounded-full bg-rose-500 shadow-lg shadow-rose-500/50";
                sText.textContent = "已停止"; sText.className = "font-bold text-sm text-rose-500";
            }
            document.getElementById('conf_dir_lbl').textContent = (statusData && statusData.confdir) || '/etc/sing-box';

            const files = await fetchAPI('list');
            localFilesCache = files; 
            files.sort((a,b) => b.mtime - a.mtime);
            
            // 【核心修正】：從當前實際生效的 config.json 中提取出站節點指紋
            const mainConfigFile = files.find(f => f.name.split('/').pop() === 'config.json');
            let activeOutboundsStr = "";
            if (mainConfigFile) {
                try {
                    const mainJson = JSON.parse(mainConfigFile.content);
                    if (mainJson.outbounds) activeOutboundsStr = JSON.stringify(mainJson.outbounds);
                } catch(e) {}
            }

            const localSavedActive = localStorage.getItem('pure_front_active_config');
            const tbody = document.getElementById('file_table_body');
            tbody.innerHTML = '';
            
            files.forEach(file => {
                const displayName = file.name.split('/').pop();
                if (!displayName.endsWith('.json') || displayName === 'config.json') return;
                
                let isSelected = false;
                const cleanName = displayName.toLowerCase();

                let types = '-', servers = '-';
                let fileOutboundsStr = "";
                try {
                    const json = JSON.parse(file.content);
                    if (json.outbounds && Array.isArray(json.outbounds)) {
                        fileOutboundsStr = JSON.stringify(json.outbounds);
                        let tArr = [], sArr = [];
                        json.outbounds.forEach(out => {
                            if (out.server && out.server !== '127.0.0.1' && out.server !== '::1') {
                                sArr.push(out.server); if (out.type) tArr.push(out.type);
                            }
                        });
                        if (tArr.length > 0) types = [...new Set(tArr)].join(', ');
                        if (sArr.length > 0) servers = [...new Set(sArr)].join(', ');
                    }
                } catch(e) {}

                // 【維度零】：內容核心指紋匹配（最精準的跨面板雙向異步同步源）
                if (fileOutboundsStr && activeOutboundsStr && fileOutboundsStr === activeOutboundsStr) {
                    isSelected = true;
                }

                // 維度一：深度自適應匹配（备用兜底）
                if (!isSelected && statusData) {
                    for (let key in statusData) {
                        if (typeof statusData[key] === 'string' && statusData[key].toLowerCase().includes(cleanName)) {
                            isSelected = true; break;
                        }
                    }
                }

                // 維度二：強制執行前端影子精確匹配（备用兜底）
                if (!isSelected && localSavedActive) {
                    const cleanSaved = localSavedActive.split('/').pop().toLowerCase();
                    if (cleanName === cleanSaved) { isSelected = true; }
                }

                const tr = document.createElement('tr');
                tr.className = `hover:bg-gray-50/80 transition-all ${isSelected ? 'bg-emerald-50/40 font-medium text-emerald-900' : ''}`;
                tr.innerHTML = `
                    <td class="py-4 px-6 text-center">${isSelected ? '<span class="text-emerald-600 text-lg font-bold">✔</span>' : ''}</td>
                    <td class="py-4 px-6 font-mono ${isSelected ? 'font-bold text-emerald-600' : ''}">${displayName}</td>
                    <td class="py-4 px-6 text-xs uppercase font-bold text-gray-500">${types}</td>
                    <td class="py-4 px-6 text-gray-500 max-w-xs truncate">${servers}</td>
                    <td class="py-4 px-6 text-right pr-8">
                        <div class="flex justify-end items-center gap-2 w-full">
                            <button onclick="switchConfig('${file.name}', this)" class="px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide transition-all ${isSelected ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' : 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'}">
                                ${isSelected ? '生效中' : '選用'}
                            </button>
                            <button onclick="openEditModal('${file.name}')" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-xs font-semibold tracking-wide transition-all">編輯</button>
                            <button onclick="deleteConfig('${file.name}')" class="px-4 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-full text-xs font-semibold tracking-wide transition-all">刪除</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function switchConfig(fileId, btn) {
            btn.disabled = true; 
            btn.textContent = '物理覆蓋中...';
            try {
                const targetFile = localFilesCache.find(f => f.name === fileId);
                if (!targetFile) throw new Error("找不到該配置文件內容");

                const response = await fetch(`${API_BASE}?action=write&file=config.json`, { 
                    method: 'POST', 
                    body: targetFile.content 
                });
                if (!response.ok) throw new Error("寫入主配置文件失敗，請檢查權限");

                await fetchAPI('restart'); 
                localStorage.setItem('pure_front_active_config', fileId);
                
                await renderList();
                await checkNetwork();
            } catch(e) {
                btn.disabled = false; 
                btn.textContent = '選用';
                alert('操作失敗: ' + e.message);
            }
        }

        async function doAction(action) {
            try { await fetchAPI(action); setTimeout(renderList, 1000); } catch(e) { alert('執行操作失敗: ' + e.message); }
        }

        async function deleteConfig(fileId) {
            if (confirm('確定刪除此配置嗎？')) {
                try {
                    await fetchAPI('delete', { file: fileId });
                    if(localStorage.getItem('pure_front_active_config') === fileId) {
                        localStorage.removeItem('pure_front_active_config');
                    }
                    renderList();
                } catch(e) { alert('刪除失敗: ' + e.message); }
            }
        }

        function openCreateModal() {
            isNewConfig = true; currentEditingFileId = '';
            document.getElementById('modal_title').textContent = '✨ 新建/導入配置';
            var nameInput = document.getElementById('name_input'); nameInput.value = ''; nameInput.disabled = false;
            document.getElementById('json_textarea').value = '{\n    "outbounds": []\n}';
            document.getElementById('editor_modal').classList.remove('hidden'); updateLineNumbers();
        }

        function openEditModal(fileId) {
            isNewConfig = false; currentEditingFileId = fileId; 
            const displayName = fileId.split('/').pop();
            document.getElementById('modal_title').textContent = '✏️ 編輯配置: ' + displayName;
            var nameInput = document.getElementById('name_input'); nameInput.value = displayName; nameInput.disabled = true;

            const matchedFile = localFilesCache.find(f => f.name === fileId);
            if (matchedFile) {
                let formattedContent = matchedFile.content;
                try { formattedContent = JSON.stringify(JSON.parse(formattedContent), null, 4); } catch(e) {}
                document.getElementById('json_textarea').value = formattedContent;
                document.getElementById('editor_modal').classList.remove('hidden'); updateLineNumbers();
            } else { alert('本地暫存數據丟失，請重新整理網頁。'); }
        }

        function closeModal() { document.getElementById('editor_modal').classList.add('hidden'); }

        async function saveConfigFile() {
            var nameInput = document.getElementById('name_input'); var displayName = nameInput.value.trim();
            if (!displayName) { alert('請輸入文件名稱！'); return; }
            if (!displayName.endsWith('.json')) displayName += '.json';
            const content = document.getElementById('json_textarea').value;
            try {
                JSON.parse(content); let targetFileId = isNewConfig ? displayName : currentEditingFileId;
                await fetch(`${API_BASE}?action=write&file=${encodeURIComponent(targetFileId)}`, { method: 'POST', body: content });
                alert('配置儲存成功！');
                closeModal(); renderList(); setTimeout(checkNetwork, 1000);
            } catch(e) { alert('JSON 錯誤，無法儲存: \n' + e.message); }
        }

        function checkSyntax() {
            try { JSON.parse(document.getElementById('json_textarea').value); alert('JSON 格式正確 ✔'); } catch(e) { alert('語法錯誤: ' + e.message); }
        }

        function formatJson() {
            const ta = document.getElementById('json_textarea');
            try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 4); updateLineNumbers(); } catch(e) { alert('格式化失敗，請先檢查語法'); }
        }

        function updateLineNumbers() {
            const ta = document.getElementById('json_textarea'); const count = ta.value.split('\n').length + 5;
            let html = ''; for(let i=1; i<=count; i++) html += i + '<br>'; document.getElementById('line_numbers').innerHTML = html;
        }

        function syncScroll() {
            const ta = document.getElementById('json_textarea'); document.getElementById('line_numbers').scrollTop = ta.scrollTop;
        }

        window.onload = () => {
            renderList(); checkNetwork();
            // 【核心修正】：縮短同步時間至 5 秒，實現與 OpenWrt 后台高頻同步
            setInterval(renderList, 5000);
        };
    </script>
</body>
</html>
